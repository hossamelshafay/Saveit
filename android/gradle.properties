org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=true
# audioplayers_android 5.3.0 applies a test plugin that still uses the AGP legacy DSL.
android.newDsl=false
# AGP Kotlin compilation can fail to close incremental caches on Windows.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
